<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vibe Coding — Lectures</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root {
    --bg: #0b0b0f;
    --panel: #14141b;
    --panel-hi: #1d1d27;
    --border: #2a2a36;
    --text: #e8e8ee;
    --muted: #8a8a97;
    --accent: #7c5cff;
    --accent-hi: #9a82ff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    --sidebar-w: 260px;
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: grid;
    grid-template-columns: var(--sidebar-w) 1fr;
    grid-template-rows: 100%;
    transition: grid-template-columns 0.2s ease;
  }
  body.sidebar-hidden { --sidebar-w: 0px; }

  aside.sidebar {
    background: var(--panel);
    border-right: 1px solid var(--border);
    overflow: hidden;
    padding: 18px 14px;
  }
  body.sidebar-hidden aside.sidebar {
    padding-left: 0;
    padding-right: 0;
    border-right: 0;
  }
  .brand {
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.2px;
    margin: 4px 6px 18px;
  }
  .brand small {
    display: block;
    color: var(--muted);
    font-weight: 400;
    font-size: 11px;
    margin-top: 2px;
  }

  .week {
    margin-bottom: 14px;
  }
  .week-label {
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    padding: 4px 6px;
  }
  .deck {
    display: block;
    padding: 9px 10px;
    border-radius: 7px;
    color: var(--text);
    text-decoration: none;
    cursor: pointer;
    font-size: 13px;
    border: 1px solid transparent;
    margin-top: 4px;
  }
  .deck:hover { background: var(--panel-hi); }
  .deck.active {
    background: var(--panel-hi);
    border-color: var(--accent);
    color: var(--accent-hi);
  }
  .deck .sub {
    color: var(--muted);
    font-size: 11px;
    margin-top: 2px;
  }

  /* Recording link — visually distinct from slide decks. */
  .recording {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 7px 10px;
    margin-top: 4px;
    border-radius: 7px;
    color: var(--muted);
    text-decoration: none;
    font-size: 12px;
    border: 1px solid transparent;
  }
  .recording:hover {
    background: var(--panel-hi);
    color: var(--text);
  }
  .recording .play {
    color: var(--accent-hi);
    font-size: 10px;
    line-height: 1;
  }
  .recording .ext {
    margin-left: auto;
    color: var(--muted);
    font-size: 11px;
  }

  main {
    position: relative;
    background: #000;
    overflow: hidden;
  }
  iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }
  .placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 13px;
    flex-direction: column;
    gap: 8px;
  }
  [hidden] { display: none !important; }

  .sidebar-toggle {
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 11;
    background: rgba(20,20,27,0.85);
    backdrop-filter: blur(8px);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    cursor: pointer;
    opacity: 0.5;
    transition: opacity 0.2s;
    font-family: inherit;
    padding: 0;
  }
  .sidebar-toggle:hover { opacity: 1; background: var(--panel-hi); }
  .placeholder kbd {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 6px;
    font-size: 11px;
  }

  .topbar {
    position: absolute;
    top: 10px;
    right: 12px;
    display: flex;
    gap: 6px;
    z-index: 10;
    opacity: 0.6;
    transition: opacity 0.2s;
  }
  .topbar:hover { opacity: 1; }
  .topbar a, .topbar button {
    background: rgba(20,20,27,0.85);
    backdrop-filter: blur(8px);
    color: var(--text);
    text-decoration: none;
    padding: 5px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
  }
  .topbar a:hover, .topbar button:hover { background: var(--panel-hi); }
  .topbar button.has-notes { border-color: var(--accent); color: var(--accent-hi); }

  .notes {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    width: 420px;
    max-width: 60vw;
    background: var(--panel);
    border-left: 1px solid var(--border);
    overflow-y: auto;
    padding: 50px 22px 22px;
    z-index: 5;
    transform: translateX(100%);
    transition: transform 0.2s ease;
    box-shadow: -8px 0 24px rgba(0,0,0,0.4);
  }
  .notes.open { transform: translateX(0); }
  .notes h2 {
    margin: 0 0 4px;
    font-size: 16px;
  }
  .notes h3 {
    margin: 20px 0 6px;
    font-size: 13px;
    color: var(--accent-hi);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .notes p { margin: 6px 0; color: var(--text); line-height: 1.5; }
  .notes a { color: var(--accent-hi); word-break: break-all; }
  .notes ul { margin: 4px 0; padding-left: 20px; }
  .notes li { margin: 4px 0; line-height: 1.5; }
  .notes pre {
    background: #0a0a10;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    overflow-x: auto;
    font-size: 12px;
    margin: 8px 0;
    color: #d5d5e0;
  }
  .notes code {
    background: #0a0a10;
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 1px 5px;
    font-size: 12px;
  }
  .notes pre code { background: transparent; border: 0; padding: 0; }
  .notes .empty { color: var(--muted); font-style: italic; }
</style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      Vibe Coding
      <small>Lecture viewer</small>
    </div>
    <div id="weeks"></div>
  </aside>

  <main>
    <button id="sidebarToggle" class="sidebar-toggle" type="button" title="Toggle sidebar (\)" aria-label="Toggle sidebar">☰</button>
    <div class="topbar" id="topbar" hidden>
      <a id="recordingLink" target="_blank" rel="noopener" hidden>▶ Recording ↗</a>
      <button id="notesToggle" type="button">Notes</button>
      <a id="openNew" target="_blank" rel="noopener">Open in new tab ↗</a>
    </div>
    <div class="placeholder" id="placeholder">
      <div>Pick a lecture from the sidebar.</div>
      <div><kbd>←</kbd> <kbd>→</kbd> navigate slides once a deck is loaded</div>
    </div>
    <iframe id="viewer" hidden allowfullscreen></iframe>
    <aside class="notes" id="notes"></aside>
  </main>

<script>
  // Edit this list to add weeks / decks.
  //
  // RECORDINGS: each week may have an optional `recordings` array. Each entry is
  // { label, url } — e.g. { label: "Batch 2", url: "https://drive.google.com/..." }.
  // To add a recording later, just drop a new entry into the relevant week's
  // `recordings` array. They open in a new tab and show up both in the sidebar
  // (under that week) and as a "▶ Recording" button in the topbar when any deck
  // from that week is loaded. Multiple batches per week are supported out of the box.
  const WEEKS = [
    {
      label: "Week 1",
      recordings: [
        { label: "Batch 2", url: "https://drive.google.com/file/d/1OW3MMeeV9aJqKuIADgZCVuh9Q2Pl9vpm/view" },
      ],
      decks: [
        { title: "Vibe Coding — Day 1", sub: "main deck", path: "wk1/Vibe Coding.html" },
        { title: "Day 1 Recap", sub: "summary, gotchas & report card", path: "wk1/recap.html" },
        { title: "Dashboard demo", sub: "supplemental", path: "wk1/dashboard.html" },
      ],
    },
    {
      label: "Week 2",
      decks: [
        {
          title: "Databases & Deployment — Day 2",
          sub: "main deck",
          path: "wk2/Databases and Deployment.html",
          notes: `
            <h2>Databases &amp; Deployment</h2>
            <p class="empty">Resources from the live session.</p>

            <h3>Prereqs</h3>
            <ul>
              <li>Node.js — <a href="https://nodejs.org/en/download/current" target="_blank" rel="noopener">nodejs.org/en/download/current</a></li>
              <li>Supabase account — <a href="https://supabase.com" target="_blank" rel="noopener">supabase.com</a></li>
            </ul>

            <h3>Supabase MCP setup</h3>
            <ol>
              <li>Generate a personal access token: <a href="https://supabase.com/dashboard/account/tokens" target="_blank" rel="noopener">supabase.com/dashboard/account/tokens</a><br>
                <em>(profile pic upper-right → Account Settings → Tokens)</em>
              </li>
              <li>When prompted: choose <strong>“this project”</strong> (not global), and <strong>“token”</strong> (not keys).</li>
              <li>Add the MCP server to Claude Code (replace the token):
                <pre><code>claude mcp add --transport http supabase -s project \\
  "https://mcp.supabase.com/mcp" \\
  --header "Authorization: Bearer $SUPABASE_PAT"</code></pre>
              </li>
              <li>Restart Claude (<code>/exit</code>, then <code>claude</code>) and run <code>/mcp</code> to verify.</li>
              <li>If it complains the server already exists:
                <pre><code>claude mcp remove supabase -s project</code></pre>
              </li>
            </ol>

            <h3>The build prompt</h3>
            <pre><code>build me a shared deal tracker. it should run
in a web browser. each deal has a company name,
a value, a stage, an owner, created_date,
updated_date. use supabase mcp to store the
data. build in typescript and react. no auth
for now.</code></pre>
          `,
        },
        {
          title: "What is Node.js?",
          sub: "supplemental — background",
          path: "wk2/what-is-nodejs.html",
        },
        {
          title: "Setup cheat sheet",
          sub: "supplemental — Node + Supabase MCP",
          path: "wk2/cheatsheet.html",
        },
        {
          title: "Deal Tracker demo",
          sub: "supplemental — live app",
          path: "https://deal-tracker-nu-bice.vercel.app/",
          external: true,
        },
      ],
    },
    {
      label: "Week 3",
      decks: [
        {
          title: "Keep Building — Day 3",
          sub: "main deck",
          path: "wk3/Keep Building.html",
          notes: `
            <h2>Keep Building</h2>
            <p class="empty">Shipping isn't the end — you keep adding features. Today's worked example: an AI "Draft follow-up" button on the Week 2 deal tracker.</p>

            <h3>The one prereq</h3>
            <ul>
              <li>A Gemini API key (free) — <a href="https://aistudio.google.com" target="_blank" rel="noopener">aistudio.google.com</a> → <strong>Get API key</strong> → copy</li>
            </ul>

            <h3>Wire it up</h3>
            <ol>
              <li>Paste the key into <code>.env</code>:
                <pre><code>GEMINI_API_KEY=your-key-here</code></pre>
              </li>
              <li>Tell Claude Code to use the <code>google-genai</code> library to call Gemini.</li>
              <li>Make sure <code>.env</code> is in <code>.gitignore</code> — never commit the key.</li>
            </ol>

            <h3>What's an API (the 30-second version)</h3>
            <p>Your code asks a service over the internet and gets an answer back — <strong>Supabase was one already.</strong> An LLM API is the same shape: send text, get text. Gemini, Claude, and OpenAI all work basically the same way — you mostly just swap the address and the key. We use Gemini today only because it has a <strong>free quota</strong>. At Anduin we go through <strong>LiteLLM</strong> (one gateway / one key for every provider) — you can get a key for that later.</p>

            <h3>The worked example — build prompt</h3>
            <pre><code>add a "Draft follow-up" button to each deal.
when clicked, use the google-genai library to
call Gemini with that deal's company, value,
stage, and owner, and ask it to write a short,
friendly follow-up email. show the draft in a
box I can copy. read the key from .env.</code></pre>

            <h3>Then: your turn</h3>
            <p>Pick an idea or invent your own — same shape every time: <strong>name the data, name the instruction, name where it shows up.</strong></p>
            <ul>
              <li><strong>Smart add</strong> — paste a messy email, the form fills itself in</li>
              <li><strong>Ask your pipeline</strong> — "what should I chase this week?"</li>
              <li><strong>Deal health</strong> — flag deals that look stuck</li>
              <li><strong>Next step</strong> — one suggested action per deal</li>
              <li><strong>…something weird</strong> — the one nobody listed</li>
            </ul>
          `,
        },
      ],
    },
    {
      label: "Bonus · Advanced",
      decks: [
        {
          title: "Dynamic Workflows",
          sub: "deep dive — optional",
          path: "bonus/dynamic-workflows/Dynamic Workflows.html",
          notes: `
            <h2>Dynamic Workflows</h2>
            <p class="empty">Claude builds its own team of fresh sub-agents on the fly. 60-min workshop; the two demos carry the room.</p>

            <h3>The one reframe</h3>
            <p>Stop hand-prompting agents one turn at a time — <strong>design the loop that prompts them for you.</strong> That loop is a workflow: you describe the shape, Claude writes the harness.</p>

            <h3>When to reach for one</h3>
            <p>Only when the task is <strong>long · parallel · adversarial · taste-based</strong>. Everything else is cheaper as a normal conversation.</p>

            <h3>Workshop setup</h3>
            <p>Tell Claude once, up front: <em>"For every workflow today, use Haiku for all the sub-agents."</em> Keeps a roomful of agents cheap.</p>

            <h3>The six patterns</h3>
            <ul>
              <li><strong>Classify-and-act</strong> — sort each item, route it</li>
              <li><strong>Fan-out-and-synthesize</strong> — split → parallel → merge <em>(demo)</em></li>
              <li><strong>Adversarial verification</strong> — a separate agent attacks each result <em>(demo)</em></li>
              <li><strong>Generate-and-filter</strong> — make many, keep the best</li>
              <li><strong>Tournament</strong> — agents compete, judge picks pairwise <em>(demo)</em></li>
              <li><strong>Loop-until-done</strong> — repeat until a stop condition</li>
            </ul>

            <h3>Power-ups</h3>
            <p><code>budget Nk tokens</code> · <code>/goal</code> · <code>/loop</code> · save with <code>s</code> → <code>~/.claude/workflows</code></p>
          `,
        },
        { title: "Git for Vibecoders", sub: "deep dive — optional", path: "bonus/Git for Vibecoders.html" },
      ],
    },
  ];

  const weeksEl = document.getElementById("weeks");
  const viewer = document.getElementById("viewer");
  const placeholder = document.getElementById("placeholder");
  const topbar = document.getElementById("topbar");
  const openNew = document.getElementById("openNew");
  const notesEl = document.getElementById("notes");
  const notesToggle = document.getElementById("notesToggle");
  const recordingLink = document.getElementById("recordingLink");

  const deckByPath = {};
  const weekByPath = {};
  WEEKS.forEach((w) => w.decks.forEach((d) => {
    deckByPath[d.path] = d;
    weekByPath[d.path] = w;
  }));

  notesToggle.addEventListener("click", () => {
    notesEl.classList.toggle("open");
  });

  const sidebarToggle = document.getElementById("sidebarToggle");
  const SIDEBAR_KEY = "vc.sidebarHidden";
  function setSidebar(hidden) {
    document.body.classList.toggle("sidebar-hidden", hidden);
    try { localStorage.setItem(SIDEBAR_KEY, hidden ? "1" : "0"); } catch (_) {}
  }
  sidebarToggle.addEventListener("click", () => {
    setSidebar(!document.body.classList.contains("sidebar-hidden"));
  });
  // Restore preference.
  try {
    if (localStorage.getItem(SIDEBAR_KEY) === "1") setSidebar(true);
  } catch (_) {}
  // Keyboard shortcut: `\` toggles the sidebar.
  document.addEventListener("keydown", (e) => {
    if (e.key === "\\" && !e.metaKey && !e.ctrlKey && !e.altKey) {
      const t = e.target;
      if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
      e.preventDefault();
      setSidebar(!document.body.classList.contains("sidebar-hidden"));
    }
  });

  function render() {
    weeksEl.innerHTML = "";
    WEEKS.forEach((wk) => {
      const wrap = document.createElement("div");
      wrap.className = "week";
      const label = document.createElement("div");
      label.className = "week-label";
      label.textContent = wk.label;
      wrap.appendChild(label);
      wk.decks.forEach((d) => {
        const a = document.createElement("a");
        a.className = "deck";
        a.dataset.path = d.path;
        const externalBadge = d.external ? ' <span class="sub" style="display:inline">↗</span>' : '';
        a.innerHTML = `<div>${d.title}${externalBadge}</div><div class="sub">${d.sub}</div>`;
        if (d.external) {
          a.href = d.path;
          a.target = "_blank";
          a.rel = "noopener";
        } else {
          a.addEventListener("click", (e) => {
            e.preventDefault();
            load(d.path);
          });
        }
        wrap.appendChild(a);
      });
      (wk.recordings || []).forEach((rec) => {
        const r = document.createElement("a");
        r.className = "recording";
        r.href = rec.url;
        r.target = "_blank";
        r.rel = "noopener";
        r.innerHTML = `<span class="play">▶</span><span>Recording${rec.label ? " · " + rec.label : ""}</span><span class="ext">↗</span>`;
        wrap.appendChild(r);
      });
      weeksEl.appendChild(wrap);
    });
  }

  function load(path) {
    document.querySelectorAll(".deck").forEach((el) => {
      el.classList.toggle("active", el.dataset.path === path);
    });
    placeholder.hidden = true;
    viewer.hidden = false;
    topbar.hidden = false;
    const url = encodeURI(path);
    viewer.src = url;
    openNew.href = url;

    const deck = deckByPath[path];
    const hasNotes = !!(deck && deck.notes && deck.notes.trim());
    notesEl.innerHTML = hasNotes ? deck.notes : "";
    notesToggle.hidden = !hasNotes;
    notesToggle.classList.toggle("has-notes", hasNotes);
    notesEl.classList.remove("open");

    // Surface the week's most recent recording (last in the array) in the topbar.
    const week = weekByPath[path];
    const recs = (week && week.recordings) || [];
    const rec = recs[recs.length - 1];
    if (rec) {
      recordingLink.href = rec.url;
      recordingLink.textContent = `▶ Recording${rec.label ? " · " + rec.label : ""} ↗`;
      recordingLink.hidden = false;
    } else {
      recordingLink.hidden = true;
    }
    // Refocus iframe so arrow-key navigation in the deck works immediately.
    viewer.addEventListener("load", () => {
      try { viewer.contentWindow.focus(); } catch (_) {}
      // Sync deck hash to our URL so deep links work.
      try {
        const innerLoc = viewer.contentWindow.location;
        history.replaceState(null, "", "#" + path);
      } catch (_) {
        history.replaceState(null, "", "#" + path);
      }
    }, { once: true });
  }

  render();

  // Deep-link support: open whatever's in the URL hash (local decks only).
  const initial = decodeURIComponent(location.hash.slice(1));
  const localPaths = WEEKS.flatMap((w) => w.decks.filter((d) => !d.external).map((d) => d.path));
  if (initial && localPaths.includes(initial)) {
    load(initial);
  } else if (localPaths.length) {
    load(localPaths[0]);
  }
</script>
</body>
</html>
